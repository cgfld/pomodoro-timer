        <div class="stat-card rest">
          <div class="stat-card-top">
            <span class="stat-dot orange"></span>
            <span class="stat-name">Resting</span>
          </div>
          <div class="stat-value" id="statsRestTime">0m</div>
          <div class="stat-subtext" id="statsRestBreaksCount">0 breaks taken</div>
        </div>

        <!-- Completed Cycles -->
        <div class="stat-card cycles">
          <div class="stat-card-top">
            <span class="stat-dot yellow"></span>
            <span class="stat-name">Full Cycles</span>
          </div>
          <div class="stat-value" id="statsCyclesCompleted">0</div>
          <div class="stat-subtext">8 segments each</div>
        </div>
      </div>

      <!-- Today's focus time -->
      <div class="daily-focus-card">
        <div class="daily-focus-header">
          <span class="daily-focus-title">Today's work goal</span>
          <label class="daily-focus-goal-control" for="dailyFocusGoalInput">
            Goal
            <input id="dailyFocusGoalInput" class="daily-focus-goal-input" type="number" min="0.5" max="12" step="0.5" value="2" aria-label="Daily work goal in hours">
            <span>h</span>
          </label>
        </div>
        <div class="daily-focus-readout">
          <span class="daily-focus-value" id="dailyFocusTime">0m</span>
          <span class="daily-focus-of">of</span>
          <span class="daily-focus-target" id="dailyFocusGoalValue">2h</span>
        </div>
        <div class="daily-focus-track" id="dailyFocusTrack" role="progressbar" aria-label="Daily work goal progress" aria-valuemin="0" aria-valuemax="7200" aria-valuenow="0">
          <div class="daily-focus-fill" id="dailyFocusFill"></div>
        </div>
        <span class="daily-focus-progress-text" id="dailyFocusProgressText">0% complete</span>
      </div>

      <div class="work-history-card" aria-label="Daily work history">
        <div class="work-history-header">
          <span class="daily-focus-title">Work by day</span>
          <div class="work-history-modes" role="group" aria-label="History view">
            <button type="button" class="work-history-mode active" data-history-mode="week" aria-pressed="true">Week</button>
            <button type="button" class="work-history-mode" data-history-mode="month" aria-pressed="false">Month</button>
          </div>
        </div>
        <div class="work-history-navigation">
          <button type="button" class="work-history-nav" id="workHistoryPrevious" aria-label="Previous period">‹</button>
          <span id="workHistoryPeriod" aria-live="polite"></span>
          <button type="button" class="work-history-nav" id="workHistoryNext" aria-label="Next period">›</button>
        </div>
        <div class="work-history-chart" id="workHistoryChart" role="list" aria-label="Daily focused work time"></div>
      </div>
      </section>
    </dialog>
  </div>

  <script src="app.js"></script>
</body>
</html>
