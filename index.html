<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-ambient" id="ambientBg"></div>

  <div class="app-container">
    <!-- Tomato Leafy Crown (Visible only in Tomato Theme) -->
    <div class="tomato-stem-crown" aria-hidden="true">
      <svg viewBox="0 0 160 80" width="130" height="65">
        <defs>
          <linearGradient id="leafGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#4ade80" />
            <stop offset="45%" stop-color="#16a34a" />
            <stop offset="100%" stop-color="#14532d" />
          </linearGradient>
          <linearGradient id="stemGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#22c55e" />
            <stop offset="100%" stop-color="#15803d" />
          </linearGradient>
          <filter id="stemShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="rgba(0,0,0,0.5)" />
          </filter>
        </defs>
        <g filter="url(#stemShadow)">
          <path d="M 80 48 C 65 52, 38 60, 16 54 C 28 44, 55 40, 75 46 Z" fill="url(#leafGrad)" />
          <path d="M 80 48 C 66 34, 44 20, 32 6 C 48 16, 68 28, 78 44 Z" fill="url(#leafGrad)" />
          <path d="M 80 48 C 76 28, 78 12, 80 2 C 84 12, 86 28, 84 46 Z" fill="url(#leafGrad)" />
          <path d="M 80 48 C 94 34, 116 20, 128 6 C 112 16, 92 28, 82 44 Z" fill="url(#leafGrad)" />
          <path d="M 80 48 C 95 52, 122 60, 144 54 C 132 44, 105 40, 85 46 Z" fill="url(#leafGrad)" />
          <path d="M 76 52 C 75 36, 70 20, 74 9 C 76 5, 82 5, 85 9 C 83 22, 82 36, 82 52 Z" fill="url(#stemGrad)" />
          <ellipse cx="80" cy="50" rx="10" ry="4" fill="#14532d" />
        </g>
      </svg>
    </div>

    <!-- Header -->
    <header class="app-header">
      <div class="logo">
        <span class="logo-icon">⏳</span>
        <h1>Pomodoro</h1>
      </div>
      <div class="header-actions">
        <button id="notificationBtn" class="icon-btn" title="Toggle Desktop Notifications" aria-label="Notifications">
          <svg class="bell-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span class="badge" id="notifBadge"></span>
        </button>
        <button id="statsBtn" class="icon-btn stats-open-btn" title="Open statistics" aria-label="Open statistics" aria-haspopup="dialog">
          <span aria-hidden="true">📊</span><span class="stats-open-label">Stats</span>
        </button>
        <button id="soundBtn" class="icon-btn" title="Toggle Sound Chimes" aria-label="Sound Mute/Unmute">
          <svg id="soundOnIcon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <svg id="soundOffIcon" class="hidden" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Theme Customization Switcher -->
    <div class="theme-bar" role="toolbar" aria-label="Theme Selection">
      <div class="theme-switcher" role="radiogroup" aria-label="Select Timer Appearance">
        <button class="theme-pill" data-theme="modern" role="radio" aria-checked="false" title="Modern Cyber Glow Theme">
          <span class="theme-pill-icon">✨</span>
          <span class="theme-pill-label">Modern</span>
        </button>
        <button class="theme-pill" data-theme="retro" role="radio" aria-checked="false" title="8-bit Retro Arcade Theme">
          <span class="theme-pill-icon">🕹️</span>
          <span class="theme-pill-label">8-Bit</span>
        </button>
        <button class="theme-pill active" data-theme="tomato" role="radio" aria-checked="true" title="Default Classic Kitchen Tomato Timer Theme">
          <span class="theme-pill-icon">🍅</span>
          <span class="theme-pill-label">Tomato</span>
        </button>
      </div>
    </div>

    <!-- Cycle Progress & Light Indicators -->
    <section class="cycle-section" aria-label="Pomodoro Cycle Lights">
      <div class="cycle-header">
        <span class="cycle-title">Current Cycle</span>
        <span class="cycle-counter" id="cycleSummary">Segment 1 of 8</span>
      </div>

      <!-- Segment Lights Container -->
      <div class="lights-track" id="lightsTrack" role="tablist" aria-label="Segments list">
        <!-- Rendered dynamically by JavaScript -->
      </div>

      <!-- Legend -->
      <div class="lights-legend">
        <div class="legend-item"><span class="legend-dot green"></span> 25m Work</div>
        <div class="legend-item"><span class="legend-dot orange"></span> 5m Short Rest</div>
        <div class="legend-item"><span class="legend-dot yellow"></span> 20m Long Rest</div>
      </div>
    </section>

    <!-- Main Timer Display -->
    <main class="timer-main">
      <div class="timer-display-wrapper">
        <!-- Tomato Mechanical Timer Face (Tomato Theme) -->
        <div class="tomato-dial-face" aria-hidden="true">
          <svg class="tomato-dial-svg" viewBox="0 0 290 290">
            <!-- Static Outer Housing Bezel -->
            <circle cx="145" cy="145" r="141" class="tomato-dial-housing" />

            <!-- Rotating Timer Dial Disk -->
            <g id="tomatoRotatingDial" class="tomato-rotating-dial">
              <!-- Cream Dial Face Surface -->
              <circle cx="145" cy="145" r="136" class="tomato-dial-face-bg" />
              <circle cx="145" cy="145" r="136" class="tomato-dial-rim-border" />
              <circle cx="145" cy="145" r="96" class="tomato-dial-inner-ring" />

              <!-- All 60 Minute Ticks -->
              <g class="tomato-dial-ticks">
                <line x1="145" y1="10" x2="145" y2="25" class="tomato-tick-major" transform="rotate(0 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(354 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(348 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(342 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(336 145 145)" />
                <line x1="145" y1="10" x2="145" y2="25" class="tomato-tick-major" transform="rotate(330 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(324 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(318 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(312 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(306 145 145)" />
                <line x1="145" y1="10" x2="145" y2="25" class="tomato-tick-major" transform="rotate(300 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(294 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(288 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(282 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(276 145 145)" />
                <line x1="145" y1="10" x2="145" y2="25" class="tomato-tick-major" transform="rotate(270 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(264 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(258 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(252 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(246 145 145)" />
                <line x1="145" y1="10" x2="145" y2="25" class="tomato-tick-major" transform="rotate(240 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(234 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(228 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(222 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(216 145 145)" />
                <line x1="145" y1="10" x2="145" y2="25" class="tomato-tick-major" transform="rotate(210 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(204 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(198 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(192 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(186 145 145)" />
                <line x1="145" y1="10" x2="145" y2="25" class="tomato-tick-major" transform="rotate(180 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(174 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(168 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(162 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(156 145 145)" />
                <line x1="145" y1="10" x2="145" y2="25" class="tomato-tick-major" transform="rotate(150 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(144 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(138 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(132 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(126 145 145)" />
                <line x1="145" y1="10" x2="145" y2="25" class="tomato-tick-major" transform="rotate(120 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(114 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(108 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(102 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(96 145 145)" />
                <line x1="145" y1="10" x2="145" y2="25" class="tomato-tick-major" transform="rotate(90 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(84 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(78 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(72 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(66 145 145)" />
                <line x1="145" y1="10" x2="145" y2="25" class="tomato-tick-major" transform="rotate(60 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(54 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(48 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(42 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(36 145 145)" />
                <line x1="145" y1="10" x2="145" y2="25" class="tomato-tick-major" transform="rotate(30 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(24 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(18 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(12 145 145)" />
                <line x1="145" y1="11" x2="145" y2="19" class="tomato-tick-minor" transform="rotate(6 145 145)" />
              </g>

              <!-- Minute Numbers 0 to 55 -->
              <g class="tomato-dial-numbers">
                <text x="145" y="37" class="tomato-num" transform="rotate(0 145 145)">0</text>
                <text x="145" y="37" class="tomato-num" transform="rotate(330 145 145)">5</text>
                <text x="145" y="37" class="tomato-num" transform="rotate(300 145 145)">10</text>
                <text x="145" y="37" class="tomato-num" transform="rotate(270 145 145)">15</text>
                <text x="145" y="37" class="tomato-num" transform="rotate(240 145 145)">20</text>
                <text x="145" y="37" class="tomato-num" transform="rotate(210 145 145)">25</text>
                <text x="145" y="37" class="tomato-num" transform="rotate(180 145 145)">30</text>
                <text x="145" y="37" class="tomato-num" transform="rotate(150 145 145)">35</text>
                <text x="145" y="37" class="tomato-num" transform="rotate(120 145 145)">40</text>
                <text x="145" y="37" class="tomato-num" transform="rotate(90 145 145)">45</text>
                <text x="145" y="37" class="tomato-num" transform="rotate(60 145 145)">50</text>
                <text x="145" y="37" class="tomato-num" transform="rotate(30 145 145)">55</text>
              </g>
            </g>

            <!-- Stationary Top Pointer Arrow at 12 o'clock -->
            <g class="tomato-dial-pointer-group">
              <path d="M 139 3 L 151 3 L 145 15 Z" class="tomato-dial-pointer-triangle" />
              <circle cx="145" cy="3" r="2.5" class="tomato-dial-pointer-dot" />
            </g>
          </svg>
        </div>

        <svg class="progress-ring" viewBox="0 0 320 320">
          <circle class="progress-ring-bg" cx="160" cy="160" r="140" />
          <circle class="progress-ring-fill" id="progressFill" cx="160" cy="160" r="140" />
        </svg>

        <div class="timer-content">
          <div class="segment-badge" id="segmentBadge">
            <span class="segment-badge-dot"></span>
            <span id="segmentName">Focus Session 1</span>
          </div>
          <div class="time-readout" id="timeDisplay">25:00</div>
          <div class="segment-subtext" id="segmentSubtext">Work interval • Stay focused</div>
        </div>
      </div>

      <!-- Controls -->
      <div class="timer-controls">
        <button id="resetBtn" class="control-btn secondary" title="Reset Current Interval" aria-label="Reset">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
          </svg>
        </button>

        <button id="startPauseBtn" class="control-btn primary" title="Start Timer (Spacebar)" aria-label="Start Timer">
          <svg id="playIcon" viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          <svg id="pauseIcon" class="hidden" viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
            <rect x="6" y="4" width="4" height="16" rx="1"></rect>
            <rect x="14" y="4" width="4" height="16" rx="1"></rect>
          </svg>
        </button>

        <button id="skipBtn" class="control-btn secondary" title="Skip to Next Segment" aria-label="Skip to Next Segment">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="5 4 15 12 5 20 5 4" fill="currentColor"></polygon>
            <line x1="19" y1="5" x2="19" y2="19"></line>
          </svg>
        </button>
      </div>
    </main>

    <dialog id="statsDialog" class="stats-dialog" aria-labelledby="statsDialogTitle">
      <div class="stats-dialog-header">
        <h2 id="statsDialogTitle">Your Statistics</h2>
        <button id="closeStatsBtn" class="stats-dialog-close" aria-label="Close statistics" title="Close">×</button>
      </div>
      <!-- Accomplishments & Tracking Section -->
      <section class="accomplishments-section" aria-label="Session Accomplishments">
      <div class="accomplishments-header">
        <div class="accomplishments-title-group">
          <span class="accomplishments-icon">🏆</span>
          <span class="accomplishments-title">Accomplishments</span>
        </div>
        <button id="resetStatsBtn" class="reset-stats-btn" title="Reset accomplishments history" aria-label="Reset Statistics">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
          </svg>
          <span>Reset Stats</span>
        </button>
      </div>

      <!-- Accomplishment Metric Grid -->
      <div class="accomplishments-grid">
        <!-- Work Time -->
        <div class="stat-card work">
          <div class="stat-card-top">
            <span class="stat-dot green"></span>
            <span class="stat-name">Working</span>
          </div>
          <div class="stat-value" id="statsWorkTime">0m</div>
          <div class="stat-subtext" id="statsSessionsCount">0 sessions done</div>
        </div>

        <!-- Rest Time -->
        <div class="stat-card rest">
          <div class="stat-card-top">
            <span class="stat-dot orange"></span>
            <span class="stat-name">Resting</span>
          </div>
          <div class="stat-value" id="statsRestTime">0m</div>
          <div class="stat-subtext" id="statsRestBreaksCount">0 breaks taken</div>
        </div>

        <!-- Completed Cycles -->
        <div class="stat-card cycles">
          <div class="stat-card-top">
            <span class="stat-dot yellow"></span>
            <span class="stat-name">Full Cycles</span>
          </div>
          <div class="stat-value" id="statsCyclesCompleted">0</div>
          <div class="stat-subtext">8 segments each</div>
        </div>
      </div>

      <!-- Focus vs Rest Balance Bar -->
      <div class="balance-bar-container">
        <div class="balance-bar-header">
          <span class="balance-label" id="balanceFocusLabel">Focus 0%</span>
          <span class="balance-title">Balance</span>
          <span class="balance-label" id="balanceRestLabel">Rest 0%</span>
        </div>
        <div class="balance-track">
          <div class="balance-fill-work" id="balanceFillWork" style="width: 50%;"></div>
          <div class="balance-fill-rest" id="balanceFillRest" style="width: 50%;"></div>
        </div>
      </div>
      </section>
    </dialog>
  </div>

  <script src="app.js"></script>
</body>
</html>
